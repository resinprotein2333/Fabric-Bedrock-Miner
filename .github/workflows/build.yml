# Unofficial fork build: only Minecraft 1.21.8 is built on every push to the
# maintenance branch, so this fork never conflicts with upstream releases.

name: build
on:
  push:
    branches:
      - support/1.21.8
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ["1.21.8"]
    env:
      CI_VERSION: ${{ matrix.version }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'oracle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Download dependencies (with retry)
        run: |
          for i in {1..15}; do
            echo "Attempt $i to download dependencies..."
            ./gradlew dependencies --no-daemon && break || sleep 15
          done
      - name: build
        run: ./gradlew :${{ matrix.version }}:build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts-${{ matrix.version }}
          path: versions/${{ matrix.version }}/build/libs/*.jar
