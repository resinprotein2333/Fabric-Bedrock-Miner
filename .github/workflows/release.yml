# Unofficial fork release: builds ONLY Minecraft 1.21.8 and publishes it to
# this fork's own GitHub Releases. Upstream platforms (CurseForge / Modrinth)
# are intentionally NOT touched to avoid conflicts with the official project.

name: Release (unofficial 1.21.8)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CI_VERSION: '1.21.8'
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'oracle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Download dependencies (with retry)
        run: |
          for i in {1..15}; do
            echo "Attempt $i to download dependencies..."
            ./gradlew dependencies --no-daemon && break || sleep 15
          done
      - name: build 1.21.8
        run: ./gradlew :1.21.8:build

      - name: read jar metadata
        id: jar
        run: |
          set -euo pipefail
          jar=$(find versions/1.21.8/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort | head -n 1)
          test -n "${jar}"
          version=$(unzip -p "${jar}" fabric.mod.json | jq -r '.version')
          echo "jar=${jar}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: generate release notes
        run: |
          set -euo pipefail
          # dependency versions are read from stonecutter.properties.toml,
          # so the notes stay correct after future dependency upgrades
          SEC=$(awk '/^\["1\.21\.8"\]/{f=1;next} /^\[/{f=0} f' stonecutter.properties.toml)
          FABRIC_API=$(sed -n 's/.*deps\.fabric_api *= *"\([^"]*\)".*/\1/p' <<<"$SEC")
          MALILIB=$(sed -n 's/.*deps\.malilib *= *"\([^"]*\)".*/\1/p' <<<"$SEC")
          MALILIB_MC=$(sed -n 's/.*deps\.malilib_mc *= *"\([^"]*\)".*/\1/p' <<<"$SEC")
          MOD_MENU=$(sed -n 's/.*deps\.mod_menu *= *"\([^"]*\)".*/\1/p' <<<"$SEC")
          LOADER=$(sed -n 's/^deps\.fabric_loader *= *"\([^"]*\)".*/\1/p' stonecutter.properties.toml)
          KOTLIN=$(sed -n 's/^deps\.fabric_kotlin *= *"\([^"]*\)".*/\1/p' stonecutter.properties.toml)
          test -n "${FABRIC_API}" && test -n "${MALILIB}" && test -n "${LOADER}" && test -n "${KOTLIN}"
          sed -e "s|{{FABRIC_API}}|${FABRIC_API}|g" \
              -e "s|{{MALILIB}}|${MALILIB}|g" \
              -e "s|{{MALILIB_MC}}|${MALILIB_MC}|g" \
              -e "s|{{MOD_MENU}}|${MOD_MENU}|g" \
              -e "s|{{LOADER}}|${LOADER}|g" \
              -e "s|{{KOTLIN}}|${KOTLIN}|g" \
              .github/release-notes-template.md > release-notes.md

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.jar.outputs.version }}
          JAR: ${{ steps.jar.outputs.jar }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="build-${GITHUB_RUN_NUMBER}"
            gh release create "${TAG}" "${JAR}" \
              --target "${GITHUB_SHA}" \
              --prerelease \
              --title "Bedrock-Miner ${VERSION} (Unofficial)" \
              --notes-file release-notes.md
          else
            TAG="${GITHUB_REF_NAME}"
            gh release create "${TAG}" "${JAR}" \
              --title "Bedrock-Miner ${VERSION} (Unofficial)" \
              --notes-file release-notes.md
          fi
